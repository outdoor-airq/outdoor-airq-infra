# Grafana veri kaynakları — dosyadan geliyor, arayüzden tanımlanmıyor.
# $GRAFANA_DB_USER / $GRAFANA_DB_PASSWORD compose'daki environment'tan gelir (monitoring/.env).
#
# DİKKAT: Bu kullanıcı veritabanı SAHİBİ DEĞİL, salt okunur bir roldür. Sebebi: Grafana'da
# Editor/Admin yetkisi olan herkes Explore ekranından SERBEST SQL çalıştırabilir. Sahip
# kullanıcıyla bağlansaydı bir Grafana girişi `DROP TABLE raw_readings` yetkisi demek olurdu —
# yani panolar için verilen bir parola, üretim verisini silme yetkisine dönüşürdü.
# Rol doğrulandı: SELECT çalışıyor, DROP "must be owner of table" ile reddediliyor.

apiVersion: 1

datasources:
  # Uygulamanın kendi verisi. TimescaleDB düz PostgreSQL olduğu için Grafana'nın
  # postgres sürücüsü doğrudan çalışıyor — arada exporter yok, veri kopyalanmıyor,
  # Grafana canlı tabloya SQL sorusu soruyor.
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    url: timescaledb:5432
    database: aqi_db
    user: $GRAFANA_DB_USER
    isDefault: true
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      sslmode: disable          # aynı docker ağı, dışarı çıkmıyor
      postgresVersion: 1600     # PG 16
      timescaledb: true         # time_bucket() gibi fonksiyonları tanısın

  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST
