name: Deploy (prod)

# core / synthetic-data repolarindaki build workflow'u, image'leri GHCR'ye push ettikten
# sonra buraya repository_dispatch ile sinyal atar.
# Payload: {"sha": "...", "services": "backend mqtt aqi-flink-job ..."}
#
# Servisler TEK dispatch'te toplu gelir cunku hepsi ayni commit'ten dogar. Servis basina
# ayri dispatch atilsaydi asagidaki concurrency grubu ortadakileri iptal ederdi (GitHub bir
# grupta yalniz BIR bekleyen calistirma tutar) ve o servislerin *_SHA'si .env'e hic
# yazilmadan prod karisik image surumleriyle kosardi.
on:
  repository_dispatch:
    types: [core-image-updated, synthetic-data-image-updated]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false      # suren bir rollout'u yarida kesme

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SHA'yi .env'e yaz ve rollout et
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/outdoor-airq-infra

            SHA="${{ github.event.client_payload.sha }}"
            SERVICES="${{ github.event.client_payload.services }}"

            if [ -z "$SHA" ] || [ -z "$SERVICES" ]; then
              echo "payload eksik (sha/services) — elle tetiklenmis olabilir, yalnizca pull+up yapiliyor"
            else
              cp .env ".env.bak.$(date +%s)"
              for SVC in $SERVICES; do
                # servis adi -> env degiskeni: backend -> BACKEND_SHA, aqi-flink-job -> AQI_FLINK_JOB_SHA
                VAR="$(echo "$SVC" | tr '[:lower:]-' '[:upper:]_')_SHA"
                if ! grep -q "^${VAR}=" .env; then
                  echo "HATA: .env icinde ${VAR} tanimli degil" >&2
                  exit 1
                fi
                sed -i "s/^${VAR}=.*/${VAR}=${SHA}/" .env
                echo "${VAR} -> ${SHA}"
              done
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps
